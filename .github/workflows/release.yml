name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Run all QA scripts
        run: npm run test:all

      - name: Build Windows installer
        run: npm run electron:build

      # The desktop app lives in apps/desktop (npm workspace); its build output
      # and publish script are relative to that folder.
      - name: Verify updater release artifacts
        shell: pwsh
        working-directory: apps/desktop
        run: |
          if (-not (Test-Path -LiteralPath 'dist/latest.yml')) {
            throw 'dist/latest.yml was not generated'
          }
          $manifest = Get-Content -LiteralPath 'dist/latest.yml' -Raw
          if ($manifest -notmatch '\.exe' -or $manifest -notmatch 'sha512:') {
            throw 'dist/latest.yml is missing installer metadata'
          }
          $installerName = [regex]::Match($manifest, '(?m)^path:\s*(.+\.exe)\s*$').Groups[1].Value.Trim()
          if (-not $installerName -or -not (Test-Path -LiteralPath (Join-Path 'dist' $installerName))) {
            throw "The installer referenced by latest.yml was not generated: $installerName"
          }
          if (-not (Test-Path -LiteralPath (Join-Path 'dist' "$installerName.blockmap"))) {
            throw "The blockmap referenced by the installer was not generated: $installerName.blockmap"
          }

      - name: Publish release artifacts
        shell: pwsh
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/publish-release.ps1

      - name: Upload artifacts (fallback)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            apps/desktop/dist/
            npm-debug.log*
          if-no-files-found: ignore
