name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Electron 42+ downloads its binary on first use instead of during npm ci.
      # Fetch it up front so the Electron QA scripts don't race the download.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Run all QA scripts
        run: npm run test:all
